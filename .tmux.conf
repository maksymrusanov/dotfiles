# ============================================================
# TMUX CONFIG — BLACK & RED | MINIMAL
# ============================================================

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Disable automatic session restoration
set -g @continuum-restore 'off'

# ===== General =====
set -g mouse on
set -g focus-events on
set -g xterm-keys on

# ===== Status Bar =====
set -g status on
set -g status-position bottom
set -g status-interval 5

# Black background, red text
set -g status-style "bg=#0a0a0a,fg=#ff3030"

# Session name
set -g status-left "#S:"
set -g status-left-length 40

# No date or time
set -g status-right '#[fg=red]#(date -d "+1 hour" +%%H:%%M)'
set -g status-right-length 0

# ===== Windows =====
set -g window-status-separator " "

# Inactive windows — gray text
setw -g window-status-style "bg=#0a0a0a,fg=#777777"
setw -g window-status-format "#W"

# Active window — red text
setw -g window-status-current-style "bg=#0a0a0a,fg=#ff3030,bold"
setw -g window-status-current-format "#W*"

# ===== Automatic Rename =====
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# ===== Pane Borders =====

# Single thin lines
set -g pane-border-lines single

# Inactive pane borders — dark gray
set -g pane-border-style "fg=#444444"

# Active pane borders — red
set -g pane-active-border-style "fg=#ff3030"

# No pane titles
set -g pane-border-status off

# ===== Messages =====
set -g message-style "bg=#8b0000,fg=#ffffff,bold"
set -g message-command-style "bg=#0a0a0a,fg=#ff3030"

# ===== Copy Mode =====
setw -g mode-style "bg=#8b0000,fg=#ffffff"

# ===== Splits =====
unbind %
unbind '"'

# Standard splits
bind q split-window -h -c "#{pane_current_path}"
bind w split-window -v -c "#{pane_current_path}"



# ===== Navigation =====

# Alt + Arrows — switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift + Alt + Arrows — switch panes
bind -n M-S-Left  select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up    select-pane -U
bind -n M-S-Down  select-pane -D

# ===== Resize =====

# Ctrl + Alt + Arrows — resize panes
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

# ===== Window Switching =====
bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# ===== Copilot =====

# Prefix + o — open Copilot in right pane (45%)
bind o split-window -h -l 45% -c "#{pane_current_path}" "copilot" \; select-pane -l

# ===== Commands =====

# Prefix + r — reload config
bind r source-file ~/.tmux.conf \; display-message "TMUX CONFIG RELOADED"

# Prefix + K — kill server with confirmation
bind K confirm-before -p "Kill all tmux sessions? (y/n)" kill-server

# ===== TPM =====
run-shell '~/.tmux/plugins/tpm/tpm'
