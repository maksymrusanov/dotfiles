# ============================================================
# TMUX CONFIG — BLACK & RED | MINIMAL
# ============================================================

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Disable automatic session restoration
set -g @continuum-restore 'off'

# ===== General =====
set -g mouse on
set -g focus-events on
set -g xterm-keys on
set -g default-shell /bin/zsh

# ===== Status Bar =====
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-right ""
set -g status-style "bg=#0a0a0a,fg=#ff3030"

# ===== Windows =====
set -g window-status-separator " "

# Inactive windows
setw -g window-status-style "bg=#0a0a0a,fg=#ffffff"
setw -g window-status-format "#[fg=#ffffff]#W"

# Active window
setw -g window-status-current-style "bg=#0a0a0a,fg=#ff3030,bold"
setw -g window-status-current-format "#W*"

# ===== Automatic Rename =====
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# ===== Pane Borders =====
set -g pane-border-lines single
set -g pane-border-style "fg=#555555"
set -g pane-active-border-style "fg=#ff3030"
set -g pane-border-status off

# ===== Messages =====
set -g message-style "bg=#8b0000,fg=#ffffff,bold"
set -g message-command-style "bg=#0a0a0a,fg=#ff3030"

# ===== Copy Mode =====
setw -g mode-style "bg=#8b0000,fg=#ffffff"

# ===== Splits =====
unbind %
unbind '"'

# Prefix + h — horizontal split
bind h split-window -h -c "#{pane_current_path}"

# Prefix + v — vertical split
bind v split-window -v -c "#{pane_current_path}"

# ===== Navigation =====
# Alt + Arrows — switch panes

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


# ===== Unbind Ctrl + Arrows =====
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down
# ===== Swap Panes =====
# Ctrl + Shift + Arrows — swap adjacent panes

#bind -n C-S-Left  swap-pane -t '{left-of}'
#bind -n C-S-Right swap-pane -t '{right-of}'
#bind -n C-S-Up    swap-pane -t '{up-of}'
#bind -n C-S-Down  swap-pane -t '{down-of}'
# ===== Resize =====
# Ctrl + Alt + Arrows — resize panes

bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

# ===== Window Switching =====
# Prefix + number — switch window

bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# ===== Codex =====
# Prefix + o — open Codex in right pane (45%)

bind-key o split-window -h -f -l 45% -d \
    -c "#{pane_current_path}" \
    "/home/max/.local/bin/codex"

# ===== Commands =====

# Prefix + r — reload config
bind r source-file ~/.tmux.conf \; display-message "TMUX CONFIG RELOADED"

# Prefix + K — kill server with confirmation
bind K confirm-before -p "Kill all tmux sessions? (y/n)" kill-server

# ===== TPM =====
run-shell '~/.tmux/plugins/tpm/tpm'
